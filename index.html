<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot Point Hackathon - Closed</title>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Centers the card perfectly on the screen */
        .closed-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .closed-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 30px;
            border-radius: 15px;
            border: 4px solid var(--friends-blue, #0000ff); /* Falls back to standard blue if variable fails */
            text-align: center;
            max-width: 600px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8);
        }
        .closed-card h1 {
            font-family: 'Gloria Hallelujah', cursive;
            color: var(--friends-red, #ff0000);
            font-size: 3rem;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .closed-card h2 {
            font-family: 'Inter', sans-serif;
            color: #333;
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 900;
        }
        .closed-card p {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .friends-joke {
            font-family: 'Gloria Hallelujah', cursive !important;
            font-size: 1.3rem !important;
            color: #666 !important;
        }
    </style>
</head>
<body class="bg-central-perk">
    <div class="closed-container">
        <div class="closed-card">
            <h1>PIVOT POINT</h1>
            <h2>Registrations Closed</h2>
            <p>Thank you to everyone who registered and participated! The application window for this event is now officially closed.</p>
            <p class="friends-joke">"We are on a break... from taking new teams!"</p>
        </div>
    </div>
</body>
</html>
