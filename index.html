<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot Point Hackathon - Closed</title>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>

        /* Meet Our Sponsors Marquee Styles */
        .sponsors-wrapper {
            margin-top: 60px;
            width: 100%;
            max-width: 900px;
            background: rgb(255, 255, 255);
            padding: 20px 0;
            border-radius: 12px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.8);
            border: 3px solid #ffcc00; /* Friends yellow */
            overflow: hidden;
        }

        .sponsors-title {
            font-family: 'Gloria Hallelujah', cursive;
            text-align: center;
            font-size: 1.8rem;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .marquee-content {
            display: inline-block;
            /* 20s for a smooth, readable scrolling speed */
            animation: marquee 20s linear infinite; 
        }

        /* Pauses the scrolling when a user hovers over it */
        .marquee-content:hover {
            animation-play-state: paused;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .sponsor-card {
            display: inline-flex;
            align-items: center;
            margin: 0 35px;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            color: #333;
        }

        .sponsor-logo-placeholder {
            width: 50px;
            height: 50px;
            background-color: #f0f0f0;
            border: 2px dashed #999;
            border-radius: 8px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sponsor-logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures logos maintain their aspect ratio */
        }

        .sponsor-card strong {
            color: #0000ff; /* Friends blue */
        }
        /* Centers the card perfectly on the screen */
        .closed-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .closed-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 30px;
            border-radius: 15px;
            border: 4px solid var(--friends-blue, #0000ff); 
            text-align: center;
            max-width: 600px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8);
        }
        .closed-card h1 {
            /* Calling your custom Gabriel Weiss font */
            font-family: 'Gabriel Weiss Friends Font', 'Gabriel Weiss', 'Gloria Hallelujah', cursive;
            color: var(--friends-black, #050505);
            font-size: 3.2rem; 
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 2.3px;
        }
        .closed-card h2 {
            font-family: 'Inter', sans-serif;
            color: #333;
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 900;
        }
        .closed-card p {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .friends-joke {
            font-family: 'Gloria Hallelujah', cursive !important;
            font-size: 1.3rem !important;
            color: #666 !important;
        }
    </style>
</head>
<body class="bg-central-perk">
    <div class="closed-container">
        <div class="closed-card">
            
            <!-- Added the colored dots back in for the authentic look -->
            <h1>
                P<span style="color: var(--friends-red, #ff0000);">•</span>I<span style="color: var(--friends-blue, #0000ff);">•</span>V<span style="color: var(--friends-yellow, #ffcc00);">•</span>O<span style="color: var(--friends-red, #ff0000);">•</span>T
                <br>
                P<span style="color: var(--friends-blue, #0000ff);">•</span>O<span style="color: var(--friends-yellow, #ffcc00);">•</span>I<span style="color: var(--friends-red, #ff0000);">•</span>N<span style="color: var(--friends-blue, #0000ff);">•</span>T
            </h1>
            
            <h2>Registrations Closed</h2>
            <p>Thank you to everyone who registered! The shortlisted teams will be announced soon. The application window for this event is now officially closed.</p>
            <p class="friends-joke">"We were on a break... from taking new teams!"</p>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
